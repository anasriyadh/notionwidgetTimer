<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-tertiary: #aaaaaa;
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.25);
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --surface: #242424;
        --text-primary: #f0f0f0;
        --text-secondary: #999999;
        --text-tertiary: #555555;
        --border: rgba(255,255,255,0.12);
        --border-hover: rgba(255,255,255,0.28);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-wrap {
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .time-grid {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      margin-bottom: 0.5rem;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .time-num {
      font-size: 72px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -3px;
      font-family: 'Courier New', monospace;
      min-width: 88px;
      text-align: center;
    }

    .time-label {
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .colon {
      font-size: 56px;
      font-weight: 300;
      color: var(--text-tertiary);
      line-height: 1;
      padding-bottom: 10px;
      user-select: none;
    }

    .progress-bar-bg {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin: 1.5rem auto 0;
      max-width: 300px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--text-primary);
      border-radius: 2px;
      transition: width 0.5s linear;
      width: 100%;
    }

    .inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 2rem 0 1.5rem;
    }

    .time-input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .time-input-group label {
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .time-input-group input {
      width: 68px;
      text-align: center;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      font-weight: 500;
      padding: 8px 6px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
    }

    .time-input-group input:focus {
      border-color: var(--border-hover);
    }

    .time-input-group input::-webkit-inner-spin-button,
    .time-input-group input::-webkit-outer-spin-button { opacity: 0.4; }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn-primary {
      background: var(--text-primary);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      padding: 9px 28px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.75; }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 0.5px solid var(--border-hover);
      border-radius: var(--radius);
      padding: 9px 22px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: var(--surface); }

    .done-msg {
      display: none;
      margin-top: 1.25rem;
      font-size: 14px;
      color: var(--text-secondary);
      padding: 0.6rem 1rem;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <div class="timer-wrap">
    <div class="time-grid">
      <div class="time-block">
        <div class="time-num" id="hrs">00</div>
        <div class="time-label">hours</div>
      </div>
      <div class="colon">:</div>
      <div class="time-block">
        <div class="time-num" id="mins">25</div>
        <div class="time-label">minutes</div>
      </div>
      <div class="colon">:</div>
      <div class="time-block">
        <div class="time-num" id="secs">00</div>
        <div class="time-label">seconds</div>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress"></div>
    </div>

    <div class="inputs" id="inputs-row">
      <div class="time-input-group">
        <label for="inp-h">hours</label>
        <input type="number" id="inp-h" min="0" max="23" value="0" step="1" />
      </div>
      <div class="time-input-group">
        <label for="inp-m">minutes</label>
        <input type="number" id="inp-m" min="0" max="59" value="25" step="1" />
      </div>
      <div class="time-input-group">
        <label for="inp-s">seconds</label>
        <input type="number" id="inp-s" min="0" max="59" value="0" step="1" />
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="startBtn" onclick="startTimer()">Start</button>
      <button class="btn-secondary" id="pauseBtn" onclick="pauseTimer()" style="display:none">Pause</button>
      <button class="btn-secondary" onclick="resetTimer()">Reset</button>
    </div>

    <div class="done-msg" id="doneMsg">
      <i class="ti ti-check"></i> Time's up!
    </div>
  </div>

  <script>
    let total = 0, remaining = 0, interval = null, running = false;

    function pad(n) { return String(Math.max(0, Math.floor(n))).padStart(2, '0'); }

    function updateDisplay(secs) {
      document.getElementById('hrs').textContent  = pad(Math.floor(secs / 3600));
      document.getElementById('mins').textContent = pad(Math.floor((secs % 3600) / 60));
      document.getElementById('secs').textContent = pad(secs % 60);
      const pct = total > 0 ? (remaining / total) * 100 : 100;
      document.getElementById('progress').style.width = pct + '%';
    }

    function startTimer() {
      if (running) return;
      document.getElementById('doneMsg').style.display = 'none';
      if (remaining === 0) {
        const h = parseInt(document.getElementById('inp-h').value) || 0;
        const m = parseInt(document.getElementById('inp-m').value) || 0;
        const s = parseInt(document.getElementById('inp-s').value) || 0;
        total = h * 3600 + m * 60 + s;
        remaining = total;
      }
      if (remaining <= 0) return;
      running = true;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('pauseBtn').style.display = '';
      document.getElementById('inputs-row').style.opacity = '0.4';
      document.getElementById('inputs-row').style.pointerEvents = 'none';
      interval = setInterval(() => {
        remaining--;
        updateDisplay(remaining);
        if (remaining <= 0) {
          clearInterval(interval);
          running = false;
          document.getElementById('pauseBtn').style.display = 'none';
          document.getElementById('startBtn').style.display = '';
          document.getElementById('startBtn').textContent = 'Start';
          document.getElementById('inputs-row').style.opacity = '';
          document.getElementById('inputs-row').style.pointerEvents = '';
          document.getElementById('doneMsg').style.display = 'block';
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!running) return;
      clearInterval(interval);
      running = false;
      document.getElementById('pauseBtn').style.display = 'none';
      document.getElementById('startBtn').style.display = '';
      document.getElementById('startBtn').textContent = 'Resume';
    }

    function resetTimer() {
      clearInterval(interval);
      running = false;
      remaining = 0;
      total = 0;
      document.getElementById('doneMsg').style.display = 'none';
      document.getElementById('startBtn').style.display = '';
      document.getElementById('startBtn').textContent = 'Start';
      document.getElementById('pauseBtn').style.display = 'none';
      document.getElementById('inputs-row').style.opacity = '';
      document.getElementById('inputs-row').style.pointerEvents = '';
      const h = parseInt(document.getElementById('inp-h').value) || 0;
      const m = parseInt(document.getElementById('inp-m').value) || 0;
      const s = parseInt(document.getElementById('inp-s').value) || 0;
      updateDisplay(h * 3600 + m * 60 + s);
    }

    updateDisplay(25 * 60);
  </script>
</body>
</html>
